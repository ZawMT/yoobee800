<!DOCTYPE html>
<html>
<head>
    <title>BMI Calculator</title>
</head>
<body>
    <h1>BMI Calculator</h1>
    <form method="post">
        {% csrf_token %}
        <label>Height (cm): <input type="number" name="height" step="0.1" value="{{ height }}"></label><br><br>
        <label>Weight (kg): <input type="number" name="weight" step="0.1" value="{{ weight }}"></label><br><br>
        <button type="submit">Calculate</button>
    </form>

    {% if bmi %}
        <h2>Your BMI: {{ bmi }}</h2>
        <p>Category: {{ category }}</p>
    {% endif %}
</body>
</html>
