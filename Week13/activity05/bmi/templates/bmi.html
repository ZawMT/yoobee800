<!DOCTYPE html>
<html>
<head>
    <title>BMI Calculator</title>
</head>
<body>
    <h1>BMI Calculator</h1>
    <form method="post">
        {% csrf_token %}
        <label>Height (cm): <input type="number" name="height" step="0.1" value="{{ height }}"></label><br><br>
        <label>Weight (kg): <input type="number" name="weight" step="0.1" value="{{ weight }}"></label><br><br>
        <label>Age (years): <input type="number" name="age" step="1" value="{{ age }}"></label><br><br>
        <label>Gender:</label>
        <select name="gender">
            <option value="male" {% if gender == "male" %}selected{% endif %}>Male</option>
            <option value="female" {% if gender == "female" %}selected{% endif %}>Female</option>
        </select><br><br>
        <button type="submit">Calculate</button>
    </form>

    {% if bmi %}
        <h2>Your BMI: {{ bmi }}</h2>
        <p>Category: {{ category }}</p>
        <p><u>Diet and exercise plan for a month</u></p>
        <div>{{ diet_n_exercise_plan|safe }}</div>
    {% endif %}
</body>
</html>
